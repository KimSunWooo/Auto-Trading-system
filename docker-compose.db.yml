services:
  mysql:
    image: mysql:8.4
    container_name: auto-trading-mysql
    environment:
      MYSQL_ROOT_PASSWORD: local
      MYSQL_DATABASE: auto_trading
      MYSQL_USER: autotrading_app
      MYSQL_PASSWORD: local
    ports:
      - "3307:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - auto-trading-mysql:/var/lib/mysql
      - ./db/baseline.mysql.sql:/docker-entrypoint-initdb.d/01-baseline.sql:ro

volumes:
  auto-trading-mysql:
